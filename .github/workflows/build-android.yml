name: build-android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install eBPF build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly --component rust-src
      
      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install bpf-linker
        shell: bash
        run: |
          set -euo pipefail
          cargo binstall bpf-linker --no-confirm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build eBPF object
        shell: bash
        run: |
          set -euo pipefail
          cd ebpf
          cargo +nightly build \
            --target bpfel-unknown-none \
            --release \
            -Zbuild-std=core
          cp target/bpfel-unknown-none/release/aether-ebpf ../ebpf_target.o

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt
          path: out/*.zip
