name: Build Aether OptExt

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with eBPF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install LLVM/Clang (for bpf-linker)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18 llvm-18-dev libclang-18-dev lld-18 \
            build-essential pkg-config
          # 让 llvm-sys / bpf-linker 能找到 LLVM
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=/usr/bin/llvm-config-18" >> "$GITHUB_ENV"
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          llvm-config-18 --version
          llvm-config-18 --libs

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: bpfel-unknown-none

      - name: Install bpf-linker
        run: |
          cargo install bpf-linker --locked
          bpf-linker --version

      - name: Build eBPF
        working-directory: ebpf
        run: |
          cargo +nightly build \
            --target bpfel-unknown-none \
            --release \
            -Zbuild-std=core

      - name: Prepare ebpf_target.o
        run: |
          # 产物名以实际为准，常见如下
          if [ -f ebpf/target/bpfel-unknown-none/release/aether-ebpf ]; then
            cp ebpf/target/bpfel-unknown-none/release/aether-ebpf ebpf_target.o
          elif [ -f ebpf/target/bpfel-unknown-none/release/ebpf ]; then
            cp ebpf/target/bpfel-unknown-none/release/ebpf ebpf_target.o
          else
            echo "eBPF build output not found:"
            find ebpf/target -type f | head -50
            exit 1
          fi
          ls -lh ebpf_target.o
          file ebpf_target.o

      - name: Build Android module
        run: python build.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt
          path: out/Aether-OptExt_*.zip
          if-no-files-found: error
          retention-days: 30
