# .github/workflows/build.yml
# Aether_OptExt GitHub Actions 构建脚本（修复 LLVM 版本冲突版）
# 只改这个文件，不动 build.py

name: Aether-OptExt Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rust-src  # 确保 build-std 可用

      - name: Install bpf-linker with rust-llvm-20 (强制匹配 rustc LLVM)
        run: |
          cargo install bpf-linker --no-default-features --features rust-llvm-20 --force

      - name: Build Rust main binary
        run: cargo build --release --target aarch64-linux-android

      - name: Build eBPF (强制用 rustc 自带 LLVM 20)
        run: |
          cd ebpf
          cargo +nightly build --target bpfel-unknown-none --release -Zbuild-std=core

      - name: Package
        run: |
          # 打包逻辑（与 build.py 完全相同）
          mkdir -p out
          cp target/aarch64-linux-android/release/aether-optext out/
          cp ebpf/target/bpfel-unknown-none/release/aether-ebpf.o out/  # 修复后 ebpf_target.o
          cd out && zip -r Aether-OptExt_$(date +%Y%m%d_%H%M%S).zip . && echo "✅ 构建成功！文件在 out/ 目录"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt
          path: out/
