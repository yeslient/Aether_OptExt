name: Build Aether OptExt

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Aether OptExt
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libclang-dev

      - name: Install bpf-linker
        run: |
          cargo install bpf-linker --locked

      - name: Check toolchain
        run: |
          rustc --version
          cargo --version
          rustc +nightly --version
          python --version
          clang --version
          llvm-config --version
          bpf-linker --version
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME"

      - name: Build eBPF
        working-directory: ebpf
        run: |
          cargo +nightly build \
            --target bpfel-unknown-none \
            --release \
            -Zbuild-std=core

      - name: Prepare eBPF object
        run: |
          cp ebpf/target/bpfel-unknown-none/release/aether-ebpf ebpf_target.o
          ls -lh ebpf_target.o
          file ebpf_target.o

      - name: Build Android module
        run: |
          python build.py

      - name: Show build output
        run: |
          ls -lah out/
          ls -lah magisk_module/

      - name: Upload Aether OptExt ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt
          path: out/Aether-OptExt_*.zip
          if-no-files-found: error
          retention-days: 30
