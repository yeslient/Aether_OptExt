name: Build Aether OptExt

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pin: bpfel-unknown-none has no prebuilt rust-std; we need rust-src + -Zbuild-std.
  RUST_NIGHTLY: nightly-2025-01-15
  BPF_LINKER_VERSION: 0.9.14
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: Build with eBPF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Install LLVM/Clang (for bpf-linker)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-18 llvm-18 llvm-18-dev libclang-18-dev lld-18 \
            build-essential pkg-config
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "${GITHUB_ENV}"
          echo "LLVM_CONFIG_PATH=/usr/bin/llvm-config-18" >> "${GITHUB_ENV}"
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          llvm-config-18 --version

      - name: Setup Rust stable (Android userspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Rust nightly (eBPF, build-std)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src
          # Do NOT add bpfel-unknown-none here — no rust-std component exists.

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ebpf -> target
          cache-on-failure: true

      - name: Install bpf-linker
        run: |
          set -euo pipefail
          cargo +stable install bpf-linker --locked --version "${BPF_LINKER_VERSION}"
          bpf-linker --version

      - name: Build eBPF
        working-directory: ebpf
        run: |
          set -euo pipefail
          cargo +${RUST_NIGHTLY} build \
            --target bpfel-unknown-none \
            --release \
            -Zbuild-std=core

      - name: Prepare ebpf_target.o
        run: |
          set -euo pipefail
          # Match the [[bin]] / package name in ebpf/Cargo.toml.
          src="ebpf/target/bpfel-unknown-none/release/aether-ebpf"
          if [[ ! -f "${src}" ]]; then
            echo "eBPF object not found at ${src}"
            find ebpf/target -type f | head -50
            exit 1
          fi
          cp "${src}" ebpf_target.o
          ls -lh ebpf_target.o
          file ebpf_target.o

      - name: Build Android module
        run: python build.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OptExt
          path: out/Aether-OptExt_*.zip
          if-no-files-found: error
          retention-days: 30
